<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ owner.site }} - web developer and video editor. Python, Java and Node.js.">
  <title>{% block title %}{{ owner.site }}{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%237c6cff'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle' fill='white' font-family='Arial' font-weight='700'%3EN%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script>document.documentElement.classList.add('js');</script>
</head>
<body data-page="{{ page }}">
  <div class="bg" aria-hidden="true">
    <span class="orb o1"></span><span class="orb o2"></span><span class="orb o3"></span>
  </div>

  <header class="nav">
    <div class="wrap nav-inner">
      <a class="brand" href="{{ url_for('home') }}"><span class="logo">N</span> {{ owner.site }}</a>
      <button class="burger" id="burger" type="button" aria-label="Open menu" aria-expanded="false">&#9776;</button>
      <nav class="links" id="links">
        <a href="{{ url_for('home') }}" class="{{ 'active' if page == 'home' }}">Home</a>
        <a href="{{ url_for('about') }}" class="{{ 'active' if page == 'about' }}">About</a>
        <a href="{{ url_for('projects') }}" class="{{ 'active' if page == 'projects' }}">Projects</a>
        <a href="{{ url_for('resume_page') }}" class="{{ 'active' if page == 'resume' }}">Resume</a>
        <a href="{{ url_for('contact') }}" class="btn small primary">Get a website</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <div class="wrap foot-inner">
      <p>&copy; <span id="year">2026</span> {{ owner.name }}. All rights reserved.</p>
      <p><a href="mailto:{{ owner.email }}">{{ owner.email }}</a></p>
    </div>
  </footer>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
